name = "tryarnold"
main = "src/index.ts"
compatibility_date = "2025-10-16"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "arnold"
database_id = "b426973c-62b0-498b-b67a-d2544d3060bd"
migrations_dir = "migrations"

[vars]
APP_RUNTIME = "worker"
APP_NAME = "telegram-fitness-coach"
PUBLIC_BASE_URL = "https://tryarnold.shrujan-beesetty.workers.dev"
OPENROUTER_MODEL = "deepseek/deepseek-v4-flash"
OPENROUTER_VISION_MODEL = "google/gemini-2.5-flash-lite"
PORTION_CONFIDENCE_THRESHOLD = "0.6"
MEAL_CONFIRM_MAX_CALORIES = "1200"
PENDING_MEAL_TTL_MINUTES = "30"
PORTION_SIZE_SMALL = "0.7"
PORTION_SIZE_LARGE = "1.3"
